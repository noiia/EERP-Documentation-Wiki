name: Build and publish docs image

# Builds the mkdocs+nginx image (Dockerfile) and publishes it to ghcr.io on every
# push to main, so a deploy server can just `docker compose pull` it (see
# deploy.sh). `mkdocs build --strict` runs as part of the image build itself
# (see Dockerfile) — a broken build (bad links, invalid nav) fails this job
# before anything is published, so there's no separate test job gating it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag applied to the published image"
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr requires a lowercase path; repository_owner is already lowercase here.
          images: ghcr.io/${{ github.repository_owner }}/eerp-docs
          tags: |
            type=raw,value=${{ inputs.image_tag || 'latest' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
